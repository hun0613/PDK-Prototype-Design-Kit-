<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDK · 메인 (SCR-MAIN-001)</title>
  <link rel="stylesheet" href="engine/common.css" />
  <style>
    /* 데모용 스켈레톤 (실제로는 /pdk-wireframe가 생성) */
    .pdk-screen { width: 100%; height: 100%; display: flex; flex-direction: column; padding: 40px; gap: 24px; }
    .pdk-title { height: 44px; width: 60%; border-radius: 12px; background: #e9ecef; }
    .pdk-sub { height: 20px; width: 40%; border-radius: 8px; background: #eef0f2; }
    .pdk-hero { flex: 1; border-radius: 20px; background: #eef0f2; min-height: 120px; }
    .pdk-btn-start {
      height: 64px; border-radius: 14px; border: none;
      background: #3182F6; color: #fff; font-size: 20px; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="device-stage">
    <div class="device-mockup">
      <div class="device-frame">
        <div class="device-screen">
          <div class="pdk-screen">
            <div class="pdk-title"></div>
            <div class="pdk-sub"></div>
            <div class="pdk-hero"></div>
            <button class="pdk-btn-start" type="button">시작하기</button>
          </div>
        </div>
      </div>
      <div class="device-stand"></div>
      <div class="device-base"></div>
    </div>
  </div>

  <!-- config (엔진보다 먼저 로드) -->
  <script src="config/devices.js?v=3"></script>
  <script src="config/project.js?v=3"></script>
  <script src="config/screens.js?v=3"></script>
  <!-- 엔진 -->
  <script src="engine/common.js?v=3"></script>
</body>
</html>
