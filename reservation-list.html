<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=400, initial-scale=1.0" />
  <title>엘커넥트 · 예약목록 페이지 (LCN-ATH-005)</title>
  <link rel="stylesheet" href="styles/common.css" />
  <style>
    /* ───────────────────────────────────────────
       예약목록 페이지 (LCN-ATH-005) — Figma 339:339 확정
       Canvas 400×640
       ─────────────────────────────────────────── */
    .reservation-screen {
      position: absolute;
      inset: 0;
      background: #ffffff;
      font-family: "Pretendard", -apple-system, sans-serif;
      overflow: hidden;
    }

    /* 1. 좌상단 뒤로가기 (8,8, 40×40) */
    .reservation-back {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 40px;
      height: 40px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      border-radius: 8px;
    }
    .reservation-back svg {
      display: block;
      pointer-events: none;
    }

    /* 1-2. 우상단 홈 버튼 (352,8, 40×40, home.png 패딩 포함) */
    .reservation-home {
      position: absolute;
      top: 8px;
      left: 352px;
      width: 40px;
      height: 40px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      border-radius: 8px;
    }
    .reservation-home img {
      width: 40px;
      height: 40px;
      display: block;
      pointer-events: none;
    }

    /* 2. 헤더 (y:48, w:400, h:113, padding 24, gap:4) */
    .reservation-subtitle {
      position: absolute;
      left: 24px;
      top: 72px;
      width: 352px;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.37;
      text-align: center;
      background: linear-gradient(151.4deg, #1EA3AE 40.865%, #2F87EA 59.621%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }
    .reservation-title {
      position: absolute;
      left: 24px;
      top: 99px;
      width: 352px;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.37;
      color: #363D4A;
      text-align: center;
    }

    /* 3. 예약 카드 (y:161, w:400, h:160) */
    .reservation-card {
      position: absolute;
      left: 0;
      top: 161px;
      width: 400px;
      height: 160px;
      padding: 16px 16px 16px 24px;
      display: flex;
      gap: 20px;
      align-items: center;
      box-sizing: border-box;
    }

    /* 3-1. 이미지 박스 (128×128, bg #F3F4F6, radius 16) */
    .reservation-card-image {
      flex-shrink: 0;
      width: 128px;
      height: 128px;
      background: #F3F4F6;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .reservation-card-image img {
      width: 80px;
      height: 80px;
      display: block;
      pointer-events: none;
    }

    /* 3-2. 정보 영역 (212×128) */
    .reservation-card-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-self: stretch;
      justify-content: space-between;
      padding: 0;
    }

    .reservation-card-top {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-start;
    }

    .reservation-badge {
      background: #2F71D0;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
      padding: 4px 6px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .reservation-card-title {
      font-size: 22px;
      font-weight: 600;
      color: #363D4A;
      line-height: 1.3;
    }

    .reservation-card-bottom {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .reservation-card-bottom .col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .reservation-card-bottom .label {
      font-size: 15px;
      font-weight: 500;
      color: #6B7684;
      line-height: 1.4;
    }
    .reservation-card-bottom .value {
      font-size: 20px;
      font-weight: 600;
      color: #363D4A;
      line-height: 1.3;
    }

    /* 4. 하단 영역 (bottom, w:400, h:142, pb 20, px 24, items-center justify-end) */
    .reservation-bottom {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      width: 400px;
      height: 142px;
      padding: 0 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      box-sizing: border-box;
    }

    .reservation-confirm-btn {
      width: 360px;
      height: 56px;
      background: #3182F6;
      color: #ffffff;
      border: none;
      border-radius: 16px;
      font-family: inherit;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="device-stage">
    <div class="device-mockup">
      <div class="device-frame">
        <div class="device-screen">
          <div class="reservation-screen">

            <!-- 1. 뒤로가기 -->
            <button class="reservation-back" type="button" onclick="history.length > 1 ? history.back() : go('qr-output.html')" aria-label="뒤로가기">
              <svg width="18" height="16" viewBox="0 0 18 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M17 8H1M1 8L8 15M1 8L8 1" stroke="#363D4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>

            <!-- 1-2. 홈 버튼 -->
            <button class="reservation-home" type="button" onclick="go('index.html')" aria-label="홈">
              <img src="assets/home.png" alt="홈" width="40" height="40" />
            </button>

            <!-- 2. 헤더 -->
            <div class="reservation-subtitle">홍길동님 반가워요!</div>
            <div class="reservation-title">예약한 내역을 확인해주세요</div>

            <!-- 3. 예약 카드 -->
            <div class="reservation-card">
              <div class="reservation-card-image">
                <img src="assets/golf-icon.png" alt="골프" />
              </div>
              <div class="reservation-card-info">
                <div class="reservation-card-top">
                  <span class="reservation-badge">기간제</span>
                  <div class="reservation-card-title">3F 15번</div>
                </div>
                <div class="reservation-card-bottom">
                  <div class="col">
                    <div class="label">시작 시간</div>
                    <div class="value">15:12</div>
                  </div>
                  <div class="col">
                    <div class="label">종료 시간</div>
                    <div class="value">19:12</div>
                  </div>
                </div>
              </div>
            </div>

            <!-- 4. 하단 버튼 -->
            <div class="reservation-bottom">
              <button class="reservation-confirm-btn" type="button" onclick="go('arrival-complete.html')">
                도착 완료하기
              </button>
            </div>

          </div>
        </div>
      </div>
      <div class="device-stand"></div>
      <div class="device-base"></div>
    </div>
  </div>

  <script src="scripts/common.js"></script>
</body>
</html>
