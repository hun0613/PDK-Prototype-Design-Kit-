<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=400, initial-scale=1.0" />
  <title>엘커넥트 · 인증방법 선택페이지 (LCN-ATH-001)</title>
  <link rel="stylesheet" href="styles/common.css" />
  <style>
    /* ───────────────────────────────────────────
       인증방법 선택페이지 (LCN-ATH-001) — Figma 308:11 확정
       Canvas 400×640, 절대 좌표 적용
       Description hover 지원 (.device-screen > .is-dimming 패턴)
       ─────────────────────────────────────────── */
    .auth-screen {
      position: absolute;
      inset: 0;
      background: #ffffff;
      font-family: "Pretendard", -apple-system, sans-serif;
      overflow: hidden;
    }

    /* 1. 좌상단 뒤로가기 (8,8, 40×40) */
    .auth-back {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 40px;
      height: 40px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      border-radius: 8px;
    }
    .auth-back svg {
      display: block;
      pointer-events: none;
    }

    /* 1-2. 우상단 홈 버튼 (352,8, 40×40, 내부 24×24 PNG) */
    .auth-home {
      position: absolute;
      top: 8px;
      left: 352px;
      width: 40px;
      height: 40px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      border-radius: 8px;
    }
    .auth-home img {
      width: 40px;
      height: 40px;
      display: block;
      pointer-events: none;
    }

    /* 2. 헤더 (Frame 308:434: 0,48, w:400, h:113, padding 24, gap:4, items-center) */
    .auth-subtitle {
      position: absolute;
      left: 24px;
      top: 72px;
      width: 352px;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.37;
      text-align: center;
      background: linear-gradient(151.4deg, #1EA3AE 40.865%, #2F87EA 59.621%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }

    .auth-title {
      position: absolute;
      left: 24px;
      top: 99px;
      width: 352px;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.37;
      color: #363D4A;
      text-align: center;
    }

    /* 3. QR 인증 카드 버튼 (x:24, y:183, w:352, h:100, radius 24) */
    .auth-qr-btn {
      position: absolute;
      left: 24px;
      top: 183px;
      width: 352px;
      height: 100px;
      background: #F2F4F6;
      border: none;
      border-radius: 24px;
      padding: 22px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      font-family: inherit;
      text-align: left;
      box-sizing: border-box;
    }

    .auth-qr-icon {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      display: block;
      pointer-events: none;
    }

    .auth-qr-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: flex-start;
    }

    .auth-qr-title {
      font-size: 24px;
      font-weight: 600;
      color: #363D4A;
      letter-spacing: -0.72px;
      line-height: 1.3;
    }

    .auth-qr-sub {
      font-size: 15px;
      font-weight: 500;
      color: #6B7684;
      line-height: 1.4;
    }

    /* 4. 하단 toss 로고 (메인페이지와 동일: y:589, 80×24) */
    .auth-logo {
      position: absolute;
      top: 589px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 24px;
      object-fit: contain;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="device-stage">
    <div class="device-mockup">
      <div class="device-frame">
        <div class="device-screen">
          <div class="auth-screen">

            <!-- 1. 뒤로가기 -->
            <button class="auth-back" type="button" onclick="history.length > 1 ? history.back() : go('index.html')" aria-label="뒤로가기">
              <svg width="18" height="16" viewBox="0 0 18 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M17 8H1M1 8L8 15M1 8L8 1" stroke="#363D4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>

            <!-- 1-2. 홈 버튼 (우상단) - 사용자 제공 home.png (패딩 포함, 40×40) -->
            <button class="auth-home" type="button" onclick="go('index.html')" aria-label="홈">
              <img src="assets/home.png" alt="홈" width="40" height="40" />
            </button>

            <!-- 2. 서브 라벨 (그라데이션) + 메인 타이틀 -->
            <div class="auth-subtitle">도착 인증</div>
            <div class="auth-title">인증 방법을 선택해주세요</div>

            <!-- 3. QR 인증 카드 버튼 -->
            <button class="auth-qr-btn" type="button" onclick="go('qr-output.html')">
              <img class="auth-qr-icon" src="assets/qr-icon.png" alt="QR" />
              <div class="auth-qr-text">
                <div class="auth-qr-title">QR 인증</div>
                <div class="auth-qr-sub">스윙와일 앱으로 QR코드를 스캔하세요</div>
              </div>
            </button>

            <!-- 4. toss 로고 -->
            <img class="auth-logo" src="assets/toss-logo.png" alt="toss" />

          </div>
        </div>
      </div>
      <div class="device-stand"></div>
      <div class="device-base"></div>
    </div>
  </div>

  <script src="scripts/common.js"></script>
</body>
</html>
