<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=400, initial-scale=1.0" />
  <title>엘커넥트 · 상품 상세페이지 (LCN-PCH-009)</title>
  <link rel="stylesheet" href="styles/common.css" />
  <style>
    /* ───────────────────────────────────────────
       상품 상세페이지 (LCN-PCH-009) — Figma 339:474 확정
       Canvas 400×640
       ─────────────────────────────────────────── */
    .product-detail-screen {
      position: absolute;
      inset: 0;
      background: #ffffff;
      font-family: "Pretendard", -apple-system, sans-serif;
      overflow: hidden;
    }

    /* 1. 이미지 영역 (0,0, 400×230, bg #F3F4F6) */
    .product-detail-image {
      position: absolute;
      left: 0;
      top: 0;
      width: 400px;
      height: 230px;
      background: #F3F4F6;
      overflow: hidden;
    }
    .product-detail-image img {
      position: absolute;
      left: 55px;
      top: -30px;
      width: 290px;
      height: 290px;
      object-fit: contain;
      pointer-events: none;
    }

    /* 2. 좌상단 뒤로가기 (8,8, 40×40) */
    .product-detail-back {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 40px;
      height: 40px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      border-radius: 8px;
      z-index: 2;
    }
    .product-detail-back svg { display: block; pointer-events: none; }

    /* 2-2. 우상단 홈 버튼 */
    .product-detail-home {
      position: absolute;
      top: 8px;
      left: 352px;
      width: 40px;
      height: 40px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      border-radius: 8px;
      z-index: 2;
    }
    .product-detail-home img {
      width: 40px;
      height: 40px;
      display: block;
      pointer-events: none;
    }

    /* 3. 상품 정보 영역 (y:230, w:400, padding 20 24, gap 12) */
    .product-detail-info {
      position: absolute;
      left: 0;
      top: 230px;
      width: 400px;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-sizing: border-box;
    }
    .product-detail-name {
      font-size: 24px;
      font-weight: 600;
      color: #363D4A;
      line-height: 1.3;
    }
    .product-detail-desc {
      font-size: 17px;
      font-weight: 400;
      color: #363D4A;
      line-height: 1.3;
    }

    /* 가격/수량 행 */
    .product-detail-price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 52px;
    }
    .product-detail-price {
      font-size: 28px;
      font-weight: 600;
      color: #363D4A;
      line-height: 1.3;
      letter-spacing: -0.28px;
      white-space: nowrap;
    }

    /* 수량 선택기 (144×52) */
    .product-detail-qty {
      display: flex;
      align-items: center;
      height: 52px;
      background: #F3F4F6;
      border-radius: 16px;
      padding: 4px;
      box-sizing: border-box;
    }
    .product-detail-qty-btn {
      width: 40px;
      height: 40px;
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      flex-shrink: 0;
      transition: opacity 0.15s ease;
    }
    .product-detail-qty-btn svg {
      display: block;
      pointer-events: none;
    }
    /* 최소 수량(1) 도달 시 — 버튼 disabled 스타일 */
    .product-detail-qty-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    /* 가운데 카운트 박스 — button 으로 변경, 좌/우 스와이프로 ±1 */
    .product-detail-qty-display {
      width: 56px;
      height: 44px;
      background: #ffffff;
      border: none;
      border-radius: 12px;
      filter: drop-shadow(0 0 4px rgba(0, 0, 0, 0.08));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
      color: #474E5C;
      line-height: 1.3;
      flex-shrink: 0;
      cursor: grab;
      font-family: inherit;
      touch-action: none;       /* 좌우 스와이프 시 페이지 스크롤 방지 */
      user-select: none;
    }
    .product-detail-qty-display:active {
      cursor: grabbing;
    }

    /* 4. 하단 영역 (bottom, 142px, gradient bg) — 안내 문구 + 결제 버튼 */
    .product-detail-bottom {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      width: 400px;
      height: 142px;
      padding: 0 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      gap: 24px;
      box-sizing: border-box;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0) 0%, #ffffff 50%);
      pointer-events: none;
    }
    .product-detail-bottom > * {
      pointer-events: auto;
    }
    .product-detail-bottom-hint {
      font-size: 15px;
      font-weight: 500;
      color: #6B7684;
      line-height: 1.4;
      text-align: center;
      white-space: nowrap;
    }
    .product-detail-pay-btn {
      width: 360px;
      height: 56px;
      background: #3182F6;
      color: #ffffff;
      border: none;
      border-radius: 16px;
      font-family: inherit;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="device-stage">
    <div class="device-mockup">
      <div class="device-frame">
        <div class="device-screen">
          <div class="product-detail-screen">

            <!-- 1. 이미지 영역 -->
            <div class="product-detail-image">
              <img src="assets/golf-icon-large.png" alt="" />
            </div>

            <!-- 2. 뒤로가기 -->
            <button class="product-detail-back" type="button" onclick="history.length > 1 ? history.back() : go('purchase.html')" aria-label="뒤로가기">
              <svg width="18" height="16" viewBox="0 0 18 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M17 8H1M1 8L8 15M1 8L8 1" stroke="#363D4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>

            <!-- 2-2. 홈 버튼 -->
            <button class="product-detail-home" type="button" onclick="go('index.html')" aria-label="홈">
              <img src="assets/home.png" alt="홈" width="40" height="40" />
            </button>

            <!-- 3. 상품 정보 -->
            <div class="product-detail-info">
              <div class="product-detail-name">주중 120분</div>
              <div class="product-detail-desc">엘커넥트 테스트용입니다.</div>

              <div class="product-detail-price-row">
                <div class="product-detail-price" id="unit-price">20,000원</div>

                <div class="product-detail-qty">
                  <button class="product-detail-qty-btn" id="qty-minus" type="button" aria-label="수량 감소" disabled>
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                      <path d="M14 20H26" stroke="#474E5C" stroke-width="1.6" stroke-linecap="round"/>
                    </svg>
                  </button>
                  <button class="product-detail-qty-display no-press" id="qty-display" type="button" aria-label="수량 (좌우 스와이프로 조절)">1</button>
                  <button class="product-detail-qty-btn" id="qty-plus" type="button" aria-label="수량 증가">
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                      <path d="M14 20H26M20 14V26" stroke="#474E5C" stroke-width="1.6" stroke-linecap="round"/>
                    </svg>
                  </button>
                </div>
              </div>
            </div>

            <!-- 4. 하단 안내 문구 + 결제 버튼 -->
            <div class="product-detail-bottom">
              <div class="product-detail-bottom-hint" id="bottom-hint">총 금액 20,000원은 타석 선택 후 결제해요</div>
              <button class="product-detail-pay-btn" type="button" onclick="go('phone-input.html')">
                다음
              </button>
            </div>

          </div>
        </div>
      </div>
      <div class="device-stand"></div>
      <div class="device-base"></div>
    </div>
  </div>

  <script src="scripts/common.js"></script>
  <script>
    // 수량 선택 + 총 금액 동적 계산
    (function () {
      const UNIT_PRICE = 20000;
      const MIN_QTY = 1;
      let qty = 1;

      const qtyDisplay = document.getElementById('qty-display');
      const bottomHint = document.getElementById('bottom-hint');
      const btnMinus   = document.getElementById('qty-minus');
      const btnPlus    = document.getElementById('qty-plus');

      const fmt = (n) => n.toLocaleString('ko-KR');

      function render() {
        qtyDisplay.textContent = qty;
        bottomHint.textContent = `총 금액 ${fmt(UNIT_PRICE * qty)}원은 타석 선택 후 결제해요`;
        // 최소 수량(1) 도달 시 - 버튼 disabled
        btnMinus.disabled = (qty <= MIN_QTY);
      }

      function inc() { qty += 1; render(); }
      function dec() { if (qty > MIN_QTY) { qty -= 1; render(); } }

      btnMinus.addEventListener('click', (e) => { e.stopPropagation(); dec(); });
      btnPlus .addEventListener('click', (e) => { e.stopPropagation(); inc(); });

      // ── 가운데 카운트 박스 좌/우 스와이프 → ±1 (실시간 이동 + 스냅백) ──
      // 박스 너비 56px 기준, 약 70% 이동 시 트리거
      const SWIPE_THRESHOLD = 40;   // 스와이프 발동 거리(px) — 박스 너비 70%
      const FREE_RANGE      = 56;   // 자유롭게 따라오는 최대 거리(px) — 박스 너비만큼
      const DAMPING         = 0.35; // 그 이상은 저항감 (러버밴드)

      let pointerActive = false;
      let startX        = null;
      let triggered     = false;

      // transform 적용 헬퍼
      function setTranslate(px, animate) {
        qtyDisplay.style.transition = animate ? 'transform 0.22s cubic-bezier(0.2, 0.8, 0.3, 1.2)' : 'none';
        qtyDisplay.style.transform  = `translateX(${px}px)`;
      }

      qtyDisplay.addEventListener('pointerdown', (e) => {
        startX        = e.clientX;
        triggered     = false;
        pointerActive = true;
        setTranslate(0, false);
        try { qtyDisplay.setPointerCapture(e.pointerId); } catch (_) {}
      });

      qtyDisplay.addEventListener('pointermove', (e) => {
        if (!pointerActive || triggered) return;
        const dx   = e.clientX - startX;
        const sign = Math.sign(dx);
        const abs  = Math.abs(dx);

        // 최소 수량(1)에서 왼쪽 스와이프는 강한 저항으로 막음 (트리거 X)
        const blocked = (qty <= MIN_QTY && dx < 0);

        // 자유 구간 + 그 너머는 저항감 있게 (러버밴드)
        // 차단 방향이면 매우 강한 저항 (살짝만 따라옴)
        const visible = blocked
          ? abs * 0.2
          : (abs <= FREE_RANGE ? abs : FREE_RANGE + (abs - FREE_RANGE) * DAMPING);
        setTranslate(sign * visible, false);

        if (!blocked && abs >= SWIPE_THRESHOLD) {
          triggered = true;
          if (dx > 0) inc();   // 오른쪽 스와이프 → +1
          else        dec();   // 왼쪽 스와이프 → -1
          // 카운트 변경 후 부드럽게 중앙 복귀
          setTranslate(0, true);
        }
      });

      const endSwipe = (e) => {
        if (pointerActive && !triggered) {
          // threshold 미달 시 부드럽게 원위치로
          setTranslate(0, true);
        }
        pointerActive = false;
        startX = null;
        try { qtyDisplay.releasePointerCapture(e.pointerId); } catch (_) {}
      };
      qtyDisplay.addEventListener('pointerup',     endSwipe);
      qtyDisplay.addEventListener('pointercancel', endSwipe);

      render();
    })();
  </script>
</body>
</html>
