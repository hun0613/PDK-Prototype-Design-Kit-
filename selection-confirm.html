<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=400, initial-scale=1.0" />
  <title>엘커넥트 · 선택내용 확인페이지 (LCN-PCH-004)</title>
  <link rel="stylesheet" href="styles/common.css" />
  <style>
    /* ───────────────────────────────────────────
       선택내용 확인페이지 (LCN-PCH-004) — Figma 310:2702 확정
       Canvas 400×640
       ─────────────────────────────────────────── */
    .confirm-screen {
      position: absolute;
      inset: 0;
      background: #ffffff;
      font-family: "Pretendard", -apple-system, sans-serif;
      overflow: hidden;
    }

    /* 1. 뒤로가기 (8,8, 40×40) */
    .confirm-back {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 40px;
      height: 40px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      border-radius: 8px;
    }
    .confirm-back svg { display: block; pointer-events: none; }

    /* 1-2. 홈 (352,8, 40×40) */
    .confirm-home {
      position: absolute;
      top: 8px;
      left: 352px;
      width: 40px;
      height: 40px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      border-radius: 8px;
    }
    .confirm-home img {
      width: 40px;
      height: 40px;
      display: block;
      pointer-events: none;
    }

    /* 2. 헤더 "이대로 결제할까요?" (y:56, padding:24, 28px Bold) */
    .confirm-title {
      position: absolute;
      left: 24px;
      top: 80px;
      width: 352px;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.37;
      color: #363D4A;
    }

    /* 3. 상품 카드 (y:142, padding 16 24, gap:16) */
    .confirm-card {
      position: absolute;
      left: 0;
      top: 142px;
      width: 400px;
      padding: 16px 24px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
      box-sizing: border-box;
    }

    .confirm-card-image {
      flex-shrink: 0;
      width: 68px;
      height: 68px;
      background: #F3F4F6;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .confirm-card-image img {
      width: 42.5px;
      height: 42.5px;
      display: block;
      pointer-events: none;
      object-fit: contain;
    }

    .confirm-card-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 상단 행: 상품명 + 수량 + 금액 */
    .confirm-row-top {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      font-size: 18px;
      font-weight: 600;
      color: #363D4A;
      line-height: 1.3;
      width: 100%;
    }
    .confirm-row-top .name { flex: 1; min-width: 0; }
    .confirm-row-top .qty  { white-space: nowrap; }
    .confirm-row-top .amt  { width: 90px; text-align: right; }

    /* 타석 리스트 */
    .confirm-seats {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 17px;
      font-weight: 400;
      color: #333D4B;
      line-height: 1.2;
    }
    .confirm-seat-row {
      display: flex;
      gap: 4px;
      align-items: flex-start;
    }
    .confirm-seat-row .floor { width: 40px; flex-shrink: 0; }
    .confirm-seat-row .num   { white-space: nowrap; }

    /* 4. 하단 결제 버튼 (bottom 0, h:196, padding 20 24) */
    .confirm-bottom {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      width: 400px;
      height: 196px;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      box-sizing: border-box;
    }
    .confirm-pay-btn {
      width: 100%;
      height: 56px;
      background: #3182F6;
      color: #ffffff;
      border: none;
      border-radius: 16px;
      font-family: inherit;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px;
    }
    .confirm-pay-btn .qty-badge {
      width: 24px;
      height: 24px;
      background: #ffffff;
      color: #3182F6;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.3;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="device-stage">
    <div class="device-mockup">
      <div class="device-frame">
        <div class="device-screen">
          <div class="confirm-screen">

            <!-- 1. 뒤로가기 -->
            <button class="confirm-back" type="button" onclick="history.length > 1 ? history.back() : go('seat-select.html')" aria-label="뒤로가기">
              <svg width="18" height="16" viewBox="0 0 18 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M17 8H1M1 8L8 15M1 8L8 1" stroke="#363D4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>

            <!-- 1-2. 홈 -->
            <button class="confirm-home" type="button" onclick="go('index.html')" aria-label="홈">
              <img src="assets/home.png" alt="홈" width="40" height="40" />
            </button>

            <!-- 2. 헤더 -->
            <div class="confirm-title">이대로 결제할까요?</div>

            <!-- 3. 상품 카드 -->
            <div class="confirm-card">
              <div class="confirm-card-image">
                <img src="assets/golf-icon.png" alt="" />
              </div>
              <div class="confirm-card-info">
                <div class="confirm-row-top">
                  <span class="name">주중 90분</span>
                  <span class="qty">3</span>
                  <span class="amt">60,000</span>
                </div>
                <div class="confirm-seats">
                  <div class="confirm-seat-row">
                    <span class="floor">2F</span>
                    <span class="num">8번</span>
                  </div>
                  <div class="confirm-seat-row">
                    <span class="floor">2F</span>
                    <span class="num">14번</span>
                  </div>
                  <div class="confirm-seat-row">
                    <span class="floor">2F</span>
                    <span class="num">20번</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- 4. 하단 결제 버튼 -->
            <div class="confirm-bottom">
              <button class="confirm-pay-btn" type="button" onclick="go('card-payment.html')">
                <span class="qty-badge">3</span>
                <span>60,000원 결제하기</span>
              </button>
            </div>

          </div>
        </div>
      </div>
      <div class="device-stand"></div>
      <div class="device-base"></div>
    </div>
  </div>

  <script src="scripts/common.js"></script>
</body>
</html>
