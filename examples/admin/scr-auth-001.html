<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 (SCR-AUTH-001)</title>
  <link rel="stylesheet" href="../../engine/common.css" />
  <style>
    /* 레이아웃 보정 — 로그인 카드 가운데 정렬 */
    .login-body { align-items: center; justify-content: center; }
    .login-card { width: 400px; gap: 12px; padding: 32px; }
  </style>
</head>
<body>
  <div class="device-stage">
    <div class="device-mockup">
      <div class="device-frame">
        <div class="device-screen">
          <div class="pdk-screen">
            <div class="pdk-w-body login-body">
              <div class="pdk-w-card login-card">
                <div class="pdk-w-icon">로고</div>
                <div class="pdk-w-title">가맹점센터 로그인</div>
                <div class="pdk-w-caption">가맹점 관리자 계정으로 로그인하세요.</div>

                <div class="pdk-w-banner pdk-login-error" data-case="error">아이디 또는 비밀번호가 올바르지 않습니다. (4/5회) 5회 틀리면 계정이 잠깁니다.</div>

                <div class="pdk-w-col pdk-login-form" style="gap: 16px; margin-top: 8px;">
                  <div class="pdk-w-field">
                    <label class="pdk-w-label">아이디</label>
                    <input class="pdk-w-input" placeholder="아이디 입력" value="bestcoffee01" />
                  </div>
                  <div class="pdk-w-field">
                    <label class="pdk-w-label">비밀번호</label>
                    <input class="pdk-w-input" type="password" placeholder="비밀번호 입력" />
                  </div>
                </div>
                <span class="pdk-w-check is-checked pdk-save-id">아이디 저장</span>
                <button class="pdk-w-btn is-primary pdk-w-btn-block pdk-w-btn-lg pdk-btn-login" onclick="goScreen('SCR-MAIN-001')">로그인</button>
                <div class="pdk-w-row pdk-find-links" style="justify-content: center; gap: 16px;">
                  <button class="pdk-w-btn is-link">아이디 찾기</button>
                  <span class="pdk-w-caption">|</span>
                  <button class="pdk-w-btn is-link">비밀번호 재설정</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="device-stand"></div>
      <div class="device-base"></div>
    </div>
  </div>

  <script src="_config.js"></script>
  <script>window.PDK_CURRENT = 'scr-auth-001.html';</script>
  <script src="../../engine/common.js"></script>
</body>
</html>
