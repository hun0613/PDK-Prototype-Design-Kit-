<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDK 예제 — 모바일</title>
  <link rel="stylesheet" href="../engine/common.css" />
  <style>
    /* ── 모바일 샘플 화면 (360×782 캔버스) ── */
    .mb-screen { position:absolute; inset:0; display:flex; flex-direction:column; background:#f5f6f8; color:#111; overflow:hidden; }

    /* 상태바 */
    .mb-status { flex:0 0 28px; display:flex; align-items:center; justify-content:space-between; padding:0 18px; font-size:12px; font-weight:600; color:#333; background:#ffffff; }
    .mb-status .ind { display:flex; gap:5px; }

    /* 앱바 */
    .pdk-appbar { flex:0 0 52px; display:flex; align-items:center; gap:10px; padding:0 16px; background:#ffffff; }
    .pdk-appbar .back { width:32px; height:32px; border:none; background:transparent; font-size:20px; color:#222; cursor:pointer; }
    .pdk-appbar .title { font-size:18px; font-weight:700; letter-spacing:-0.3px; }

    /* 본문 */
    .mb-body { flex:1; overflow-y:auto; padding:16px; }

    /* 잔액/요약 카드 */
    .pdk-card { background:linear-gradient(135deg,#3182f6 0%,#1b64da 100%); border-radius:20px; padding:22px; color:#fff; margin-bottom:18px; }
    .pdk-card .lbl { font-size:13px; font-weight:600; opacity:.85; margin-bottom:8px; }
    .pdk-card .amt { font-size:30px; font-weight:800; letter-spacing:-0.5px; }
    .pdk-card .sub { margin-top:14px; font-size:13px; font-weight:600; opacity:.9; }

    /* 메뉴 리스트 */
    .pdk-list { display:flex; flex-direction:column; gap:10px; }
    .mb-item { display:flex; align-items:center; gap:14px; background:#ffffff; border-radius:16px; padding:16px; }
    .mb-item .ico { width:44px; height:44px; border-radius:12px; background:#eaf2ff; display:flex; align-items:center; justify-content:center; font-size:22px; }
    .mb-item .txt { flex:1; }
    .mb-item .txt .t { font-size:16px; font-weight:700; }
    .mb-item .txt .d { font-size:13px; color:#8a92a0; margin-top:2px; }
    .mb-item .arr { color:#c5ccd6; font-size:18px; }

    /* 하단 고정 CTA */
    .pdk-cta { flex:0 0 auto; padding:12px 16px 20px; background:#ffffff; }
    .pdk-cta button { width:100%; height:54px; border:none; border-radius:14px; background:#3182f6; color:#fff; font-size:17px; font-weight:700; cursor:pointer; }
  </style>
</head>
<body>
  <div class="device-stage">
    <div class="device-mockup">
      <div class="device-frame">
        <div class="device-screen">
          <div class="pdk-screen mb-screen">
            <div class="mb-status"><span>9:41</span><span class="ind">●●● ▮</span></div>
            <header class="pdk-appbar">
              <button class="back" aria-label="뒤로가기">‹</button>
              <div class="title">내 지갑</div>
            </header>
            <div class="mb-body">
              <div class="pdk-card">
                <div class="lbl">총 잔액</div>
                <div class="amt">₩ 1,284,500</div>
                <div class="sub">+ 이번 달 32,000원 적립</div>
              </div>
              <div class="pdk-list">
                <div class="mb-item"><div class="ico">💳</div><div class="txt"><div class="t">결제하기</div><div class="d">QR·바코드로 간편 결제</div></div><div class="arr">›</div></div>
                <div class="mb-item"><div class="ico">💸</div><div class="txt"><div class="t">송금</div><div class="d">연락처로 바로 보내기</div></div><div class="arr">›</div></div>
                <div class="mb-item"><div class="ico">🧾</div><div class="txt"><div class="t">거래 내역</div><div class="d">최근 결제·충전 보기</div></div><div class="arr">›</div></div>
              </div>
            </div>
            <div class="pdk-cta"><button>충전하기</button></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.PDK_DEVICES = {
      mobile: { label: '모바일', type: 'frame', width: 360, height: 782, bezel: 10, radius: 40, bezelColor: '#404040' },
    };
    window.PDK_PROJECT = { name: '모바일 테스트', device: 'mobile' };
    window.PDK_SCREENS = [
      { category: '지갑', pages: [
        { id: 'APP-WLT-001', label: '내 지갑(홈)', href: 'mobile.html', designed: true,
          figmaLink: 'https://www.figma.com/design/UfaTo8FaMLnsqzAvGkNUQq/?node-id=434-2072',
          description: [
            { text: '상태바 + 앱바(뒤로가기/타이틀)', target: '.pdk-appbar' },
            { text: '잔액 요약 카드', target: '.pdk-card' },
            { text: '주요 기능 리스트(결제/송금/내역)', target: '.pdk-list' },
            { text: '충전하기 클릭 → 충전 금액 입력(APP-CHG-001)', target: '.pdk-cta' },
          ],
          flow: { to: [
            { screen: 'APP-PAY-001', via: '결제하기' },
            { screen: 'APP-CHG-001', via: '충전하기' },
          ] } },
      ] },
      { category: '결제', pages: [
        { id: 'APP-PAY-001', label: 'QR 결제', href: 'a.html', designed: false,
          description: [],
          flow: { to: [ { screen: 'APP-WLT-001', via: '완료', kind: 'auto' } ] } },
        { id: 'APP-CHG-001', label: '충전 금액 입력', href: 'b.html', designed: false,
          description: [],
          flow: { to: [ { screen: 'APP-WLT-001', via: '충전 완료', kind: 'auto' } ] } },
      ] },
      { category: '기타', pages: [
        { id: 'APP-HIS-001', label: '거래 내역', href: 'c.html', designed: true, description: [] },
        { id: 'APP-SET-001', label: '설정', href: 'd.html', designed: false, description: [] },
      ] },
    ];
    window.PDK_CURRENT = 'mobile.html';
  </script>
  <script src="../engine/common.js"></script>
</body>
</html>
