<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>등록 완료 (DEMO-DON-001)</title>
  <link rel="stylesheet" href="../../engine/common.css" />
</head>
<body>
  <div class="device-stage">
    <div class="device-mockup">
      <div class="device-frame">
        <div class="device-screen">
          <div class="pdk-screen">

            <div class="pdk-w-header">
              <div class="pdk-w-header-title pdk-title">등록 완료</div>
            </div>

            <div class="pdk-w-body">
              <div class="pdk-w-empty pdk-done-msg">
                <div class="pdk-w-thumb"></div>
                <span class="pdk-w-subtitle">등록 요청이 접수되었습니다</span>
                <span class="pdk-w-caption">보호자가 승인하면 알림으로 알려드립니다</span>
              </div>

              <div class="pdk-w-card pdk-done-card">
                <div class="pdk-w-row">
                  <div class="pdk-w-avatar"></div>
                  <div class="pdk-w-col">
                    <span class="pdk-w-item-main">박성모</span>
                    <span class="pdk-w-item-sub">부모 · 010-1234-5678</span>
                  </div>
                  <div class="pdk-w-spacer"></div>
                  <span class="pdk-w-badge">승인대기</span>
                </div>
                <div class="pdk-w-divider"></div>
                <span class="pdk-w-caption">요청일 2026-09-07 · 7일간 유효</span>
              </div>

              <span class="pdk-w-text">승인 요청 문자가 발송되었습니다. 보호자가 링크를 열어 본인인증을 마치면 등록이 완료됩니다.</span>
            </div>

            <div class="pdk-w-footer is-raised">
              <span class="pdk-w-caption">5초 후 목록으로 돌아갑니다</span>
              <button class="pdk-w-btn is-primary pdk-w-btn-block pdk-btn-home"
                      onclick="go('examples/demo/list.html')">목록으로</button>
            </div>

            <!-- 완료 토스트 -->
            <div class="pdk-w-toast pdk-toast">등록 요청이 접수되었어요</div>

          </div>
        </div>
      </div>
      <div class="device-stand"></div>
      <div class="device-base"></div>
    </div>
  </div>

  <script src="_config.js"></script>
  <script>window.PDK_CURRENT = 'done.html';</script>
  <script src="../../engine/common.js"></script>
</body>
</html>
