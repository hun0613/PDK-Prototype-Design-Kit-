<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>가족 관리 진입 (DEMO-INT-001)</title>
  <link rel="stylesheet" href="../../engine/common.css" />
</head>
<body>
  <div class="device-stage">
    <div class="device-mockup">
      <div class="device-frame">
        <div class="device-screen">
          <div class="pdk-screen">

            <div class="pdk-w-body">
              <!-- .pdk-w-bleed — 좌우 여백을 무시하고 화면 폭을 꽉 채우는 요소 -->
              <div class="pdk-w-banner pdk-w-bleed pdk-hero">
                <div class="pdk-w-icon"></div>
                <span>가족 관리 · 대리 예약과 결제를 한 곳에서</span>
              </div>

              <div class="pdk-w-spacer"></div>

              <div class="pdk-w-col pdk-intro-msg">
                <span class="pdk-w-title">가족을 등록하고<br />함께 이용하세요</span>
                <span class="pdk-w-caption">보호자와 환자를 연결하면 대리 예약·결제·주차관리를 할 수 있습니다</span>
              </div>

              <div class="pdk-w-spacer"></div>
            </div>

            <div class="pdk-w-footer">
              <!-- .pdk-w-btn-lg — 큰 버튼 -->
              <button class="pdk-w-btn is-primary pdk-w-btn-lg pdk-w-btn-block pdk-btn-start"
                      onclick="go('examples/demo/list.html')">시작하기</button>
              <span class="pdk-w-caption">잠시 후 목록으로 자동 이동합니다</span>
            </div>

          </div>
        </div>
      </div>
      <div class="device-stand"></div>
      <div class="device-base"></div>
    </div>
  </div>

  <script src="_config.js"></script>
  <script>window.PDK_CURRENT = 'intro.html';</script>
  <script src="../../engine/common.js"></script>
</body>
</html>
