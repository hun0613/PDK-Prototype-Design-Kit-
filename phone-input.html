<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=400, initial-scale=1.0" />
  <title>엘커넥트 · 휴대폰번호 입력페이지 (LCN-PCH-002)</title>
  <link rel="stylesheet" href="styles/common.css" />
  <style>
    /* ───────────────────────────────────────────
       휴대폰번호 입력페이지 (LCN-PCH-002) — Figma 308:356 확정
       Canvas 400×640
       ─────────────────────────────────────────── */
    .phone-screen {
      position: absolute;
      inset: 0;
      background: #ffffff;
      font-family: "Pretendard", -apple-system, sans-serif;
      overflow: hidden;
    }

    /* 1. 뒤로가기 (8,8, 40×40) */
    .phone-back {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 40px;
      height: 40px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      border-radius: 8px;
    }
    .phone-back svg { display: block; pointer-events: none; }

    /* 1-2. 홈 버튼 (352,8, 40×40) */
    .phone-home {
      position: absolute;
      top: 8px;
      left: 352px;
      width: 40px;
      height: 40px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      border-radius: 8px;
    }
    .phone-home img {
      width: 40px;
      height: 40px;
      display: block;
      pointer-events: none;
    }

    /* 2. 헤더 (y:56, w:400, h:113, padding 24, gap:4, center) */
    .phone-subtitle {
      position: absolute;
      left: 24px;
      top: 80px;
      width: 352px;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.37;
      text-align: center;
      background: linear-gradient(151.4deg, #1EA3AE 40.865%, #2F87EA 59.621%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }
    .phone-title {
      position: absolute;
      left: 24px;
      top: 107px;
      width: 352px;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.37;
      color: #363D4A;
      text-align: center;
    }

    /* 3. 입력 필드 (x:32, y:167, w:336, h:52) */
    .phone-input {
      position: absolute;
      left: 32px;
      top: 167px;
      width: 336px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 4px 6px 0;
      border-bottom: 2px solid #3182F6;
      box-sizing: border-box;
    }
    .phone-input-value {
      flex: 1;
      min-width: 0;
      font-size: 30px;
      font-weight: 600;
      color: #363D4A;
      line-height: 1.3;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      height: 40px;
    }
    .phone-input-clear {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      padding: 0;
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }
    .phone-input-clear img {
      width: 22px;
      height: 22px;
      display: block;
      pointer-events: none;
    }
    .phone-input-clear:disabled { opacity: 0.5; cursor: not-allowed; }

    /* 4. 키패드 (x:16, y:251, w:368, h:303, 3×4 grid, gap:8) */
    .phone-keypad {
      position: absolute;
      left: 16px;
      top: 251px;
      width: 368px;
      height: 303px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 8px;
    }
    .phone-key {
      height: 64px;
      align-self: start;
      width: 100%;
      border: none;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 24px;
      cursor: pointer;
      font-family: inherit;
      font-size: 32px;
      font-weight: 600;
      color: #515967;
      line-height: 1;
      padding: 16px 24px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* 키패드 누름 시 살짝 어두운 배경 */
    .phone-key:active {
      background: rgba(0, 0, 0, 0.05);
    }
    .phone-key:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .phone-key svg { display: block; pointer-events: none; }
    .phone-key img {
      width: 28px;
      height: 20px;
      display: block;
      pointer-events: none;
      object-fit: contain;
    }
    /* 빈 자리 (col1 row4) */
    .phone-key-empty {
      height: 64px;
      align-self: start;
    }

    /* 5. 안 할래요 (y:586, 가운데 정렬용 wrapper + 버튼)
       wrapper 가 centering 담당 → 버튼은 transform 충돌 없이 press 효과 적용 가능 */
    .phone-skip-wrap {
      position: absolute;
      left: 0;
      top: 586px;
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .phone-skip {
      display: flex;
      align-items: center;
      gap: 4px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
      font-family: inherit;
      border-radius: 8px;
    }
    .phone-skip-text {
      font-size: 16px;
      font-weight: 500;
      color: #6B7684;
      line-height: 1.4;
      white-space: nowrap;
    }
    .phone-skip svg {
      display: block;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="device-stage">
    <div class="device-mockup">
      <div class="device-frame">
        <div class="device-screen">
          <div class="phone-screen">

            <!-- 1. 뒤로가기 -->
            <button class="phone-back" type="button" onclick="history.length > 1 ? history.back() : go('product-detail.html')" aria-label="뒤로가기">
              <svg width="18" height="16" viewBox="0 0 18 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M17 8H1M1 8L8 15M1 8L8 1" stroke="#363D4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>

            <!-- 1-2. 홈 -->
            <button class="phone-home" type="button" onclick="go('index.html')" aria-label="홈">
              <img src="assets/home.png" alt="홈" width="40" height="40" />
            </button>

            <!-- 2. 헤더 -->
            <div class="phone-subtitle">타석배정이 완료되면 알림톡이 전송돼요</div>
            <div class="phone-title">휴대폰 번호를 입력해주세요</div>

            <!-- 3. 입력 필드 -->
            <div class="phone-input">
              <div class="phone-input-value" id="phone-value">010</div>
              <button class="phone-input-clear no-press" id="phone-clear" type="button" aria-label="입력 초기화" disabled>
                <img src="assets/clear-x-icon.svg" alt="" />
              </button>
            </div>

            <!-- 4. 키패드 -->
            <div class="phone-keypad">
              <button class="phone-key" type="button" data-digit="1">1</button>
              <button class="phone-key" type="button" data-digit="2">2</button>
              <button class="phone-key" type="button" data-digit="3">3</button>
              <button class="phone-key" type="button" data-digit="4">4</button>
              <button class="phone-key" type="button" data-digit="5">5</button>
              <button class="phone-key" type="button" data-digit="6">6</button>
              <button class="phone-key" type="button" data-digit="7">7</button>
              <button class="phone-key" type="button" data-digit="8">8</button>
              <button class="phone-key" type="button" data-digit="9">9</button>
              <div class="phone-key-empty"></div>
              <button class="phone-key" type="button" data-digit="0">0</button>
              <button class="phone-key" id="phone-backspace" type="button" aria-label="지우기" disabled>
                <img src="assets/backspace-icon.svg" alt="" />
              </button>
            </div>

            <!-- 5. 안 할래요 (wrapper로 가운데 정렬 → 버튼 press 효과 자유롭게) -->
            <div class="phone-skip-wrap">
              <button class="phone-skip" type="button" onclick="go('seat-select.html')">
                <span class="phone-skip-text">안 할래요</span>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M6 3L11 8L6 13" stroke="#6B7684" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>

          </div>
        </div>
      </div>
      <div class="device-stand"></div>
      <div class="device-base"></div>
    </div>
  </div>

  <script src="scripts/common.js"></script>
  <script>
    // ── 휴대폰 번호 입력 ──
    (function () {
      const PREFIX = '010';
      const MAX_DIGITS = 11;            // 010-XXXX-XXXX
      const NEXT_PAGE = 'seat-select.html'; // 11자리 완성 시 자동 진행

      let digits = PREFIX;

      const valueEl   = document.getElementById('phone-value');
      const clearBtn  = document.getElementById('phone-clear');
      const backspBtn = document.getElementById('phone-backspace');

      function formatPhone(s) {
        if (s.length <= 3) return s;
        if (s.length <= 7) return s.slice(0, 3) + '-' + s.slice(3);
        return s.slice(0, 3) + '-' + s.slice(3, 7) + '-' + s.slice(7);
      }

      function render() {
        valueEl.textContent = formatPhone(digits);
        const empty = (digits.length <= PREFIX.length);
        clearBtn.disabled  = empty;
        backspBtn.disabled = empty;
      }

      function addDigit(d) {
        if (digits.length >= MAX_DIGITS) return;
        digits += d;
        render();
        // 11자리 모두 입력 시 자동 진행
        if (digits.length === MAX_DIGITS) {
          setTimeout(() => { location.href = NEXT_PAGE; }, 280);
        }
      }

      function backspace() {
        if (digits.length > PREFIX.length) {
          digits = digits.slice(0, -1);
          render();
        }
      }

      function clearAll() {
        digits = PREFIX;
        render();
      }

      // 키패드 클릭 위임
      document.querySelectorAll('.phone-key[data-digit]').forEach(btn => {
        btn.addEventListener('click', () => addDigit(btn.dataset.digit));
      });
      backspBtn.addEventListener('click', backspace);
      clearBtn.addEventListener('click', clearAll);

      render();
    })();
  </script>
</body>
</html>
