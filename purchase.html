<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=400, initial-scale=1.0" />
  <title>엘커넥트 · 1회권상품 선택 페이지 (LCN-PCH-001)</title>
  <link rel="stylesheet" href="styles/common.css" />
  <style>
    /* ───────────────────────────────────────────
       1회권상품 선택 페이지 (LCN-PCH-001) — Figma 313:2719 확정
       Canvas 400×640
       - 상단(뒤로/홈 + "일일권" 탭 + divider)까지 sticky
       - 나머지(카테고리 라벨 + 상품 리스트)는 스크롤
       ─────────────────────────────────────────── */
    .purchase-screen {
      position: absolute;
      inset: 0;
      background: #ffffff;
      font-family: "Pretendard", -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Sticky 상단 영역 ────────────── */
    .purchase-header {
      flex-shrink: 0;
      position: relative;
      height: 120px;
      background: #ffffff;
      border-bottom: 0.5px solid #D6DBDF;
    }

    /* 좌상단 뒤로가기 (8,8, 40×40) */
    .purchase-back {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 40px;
      height: 40px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      border-radius: 8px;
    }
    .purchase-back svg { display: block; pointer-events: none; }

    /* 우상단 홈 버튼 (352,8, 40×40) */
    .purchase-home {
      position: absolute;
      top: 8px;
      left: 352px;
      width: 40px;
      height: 40px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      border-radius: 8px;
    }
    .purchase-home img {
      width: 40px;
      height: 40px;
      display: block;
      pointer-events: none;
    }

    /* 탭 영역 (y:62~120, h:58, padding 24) */
    .purchase-tabs {
      position: absolute;
      left: 0;
      top: 62px;
      width: 400px;
      height: 58px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 24px;
      box-sizing: border-box;
    }
    .purchase-tab {
      position: relative;
      min-width: 60px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 2px;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.2;
      color: #363D4A;
      background: transparent;
      border: none;
      cursor: pointer;
      box-sizing: border-box;
    }
    .purchase-tab.is-active::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: #363D4A;
    }

    /* ── 스크롤 본문 ────────────── */
    .purchase-body {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-bottom: 24px;
    }

    /* 카테고리 라벨 "일일권" (24px from left, 27px from top of body) */
    .purchase-category-label {
      padding: 27px 24px 19px;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.2;
      color: #6B7684;
    }

    /* 상품 리스트 */
    .purchase-product-list {
      display: flex;
      flex-direction: column;
    }

    /* 상품 카드 (400×160) */
    .purchase-product {
      width: 100%;
      height: 160px;
      padding: 16px 16px 16px 24px;
      display: flex;
      gap: 16px;
      align-items: center;
      background: transparent;
      border: none;
      cursor: pointer;
      box-sizing: border-box;
      font-family: inherit;
      text-align: left;
    }

    .purchase-product-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }
    .purchase-product-name {
      font-size: 24px;
      font-weight: 600;
      color: #363D4A;
      line-height: 1.3;
    }
    .purchase-product-price {
      font-size: 18px;
      font-weight: 500;
      color: #333D4B;
      line-height: 1.2;
    }

    .purchase-product-image {
      flex-shrink: 0;
      width: 128px;
      height: 128px;
      background: #F3F4F6;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .purchase-product-image img {
      width: 80px;
      height: 80px;
      display: block;
      pointer-events: none;
    }

    /* 카드 사이 구분선 (368×0.5, 좌우 16 마진) */
    .purchase-product-divider {
      height: 0.5px;
      background: #D6DBDF;
      margin: 0 16px;
    }
  </style>
</head>
<body>
  <div class="device-stage">
    <div class="device-mockup">
      <div class="device-frame">
        <div class="device-screen">
          <div class="purchase-screen">

            <!-- ── Sticky 상단 ── -->
            <div class="purchase-header">

              <!-- 뒤로가기 -->
              <button class="purchase-back" type="button" onclick="history.length > 1 ? history.back() : go('index.html')" aria-label="뒤로가기">
                <svg width="18" height="16" viewBox="0 0 18 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M17 8H1M1 8L8 15M1 8L8 1" stroke="#363D4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>

              <!-- 홈 -->
              <button class="purchase-home" type="button" onclick="go('index.html')" aria-label="홈">
                <img src="assets/home.png" alt="홈" width="40" height="40" />
              </button>

              <!-- 탭 -->
              <div class="purchase-tabs">
                <button class="purchase-tab is-active" type="button">1회권</button>
              </div>

            </div>

            <!-- ── 스크롤 본문 ── -->
            <div class="purchase-body">

              <div class="purchase-category-label">일일권</div>

              <div class="purchase-product-list">

                <button class="purchase-product" type="button" onclick="go('product-detail.html')">
                  <div class="purchase-product-info">
                    <div class="purchase-product-name">주중 60분</div>
                    <div class="purchase-product-price">15,000원</div>
                  </div>
                  <div class="purchase-product-image">
                    <img src="assets/golf-icon.png" alt="" />
                  </div>
                </button>

                <div class="purchase-product-divider"></div>

                <button class="purchase-product" type="button" onclick="go('product-detail.html')">
                  <div class="purchase-product-info">
                    <div class="purchase-product-name">주중 90분</div>
                    <div class="purchase-product-price">18,000원</div>
                  </div>
                  <div class="purchase-product-image">
                    <img src="assets/golf-icon.png" alt="" />
                  </div>
                </button>

                <div class="purchase-product-divider"></div>

                <button class="purchase-product" type="button" onclick="go('product-detail.html')">
                  <div class="purchase-product-info">
                    <div class="purchase-product-name">주중 120분</div>
                    <div class="purchase-product-price">20,000원</div>
                  </div>
                  <div class="purchase-product-image">
                    <img src="assets/golf-icon.png" alt="" />
                  </div>
                </button>

              </div>
            </div>

          </div>
        </div>
      </div>
      <div class="device-stand"></div>
      <div class="device-base"></div>
    </div>
  </div>

  <script src="scripts/common.js"></script>
</body>
</html>
