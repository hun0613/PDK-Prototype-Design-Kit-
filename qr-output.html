<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=400, initial-scale=1.0" />
  <title>엘커넥트 · QR출력페이지 (LCN-ATH-002)</title>
  <link rel="stylesheet" href="styles/common.css" />
  <style>
    /* ───────────────────────────────────────────
       QR출력페이지 (LCN-ATH-002) — Figma 310:619 확정
       Canvas 400×640, 절대 좌표 적용
       BG #F3F4F6 (회색)
       Description hover 지원 (.device-screen > .is-dimming 패턴)
       ─────────────────────────────────────────── */
    .qr-screen {
      position: absolute;
      inset: 0;
      background: #F3F4F6;
      font-family: "Pretendard", -apple-system, sans-serif;
      overflow: hidden;
    }

    /* 1. 좌상단 뒤로가기 (8,8, 40×40) */
    .qr-back {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 40px;
      height: 40px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      border-radius: 8px;
    }
    .qr-back svg {
      display: block;
      pointer-events: none;
    }

    /* 1-2. 우상단 홈 버튼 (352,8, 40×40, 내부 24×24 PNG) */
    .qr-home {
      position: absolute;
      top: 8px;
      left: 352px;
      width: 40px;
      height: 40px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      border-radius: 8px;
    }
    .qr-home img {
      width: 40px;
      height: 40px;
      display: block;
      pointer-events: none;
    }

    /* 2. 서브 라벨 "QR 인증" (절대 y:72, center, 17px Bold 그라데이션) */
    .qr-subtitle {
      position: absolute;
      left: 24px;
      top: 72px;
      width: 352px;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.37;
      text-align: center;
      background: linear-gradient(151.4deg, #1EA3AE 40.865%, #2F87EA 59.621%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }

    /* 3. 메인 타이틀 2줄 (절대 y:99, center, 28px Bold #363D4A) */
    .qr-title {
      position: absolute;
      left: 24px;
      top: 99px;
      width: 352px;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.37;
      color: #363D4A;
      text-align: center;
    }
    .qr-title p {
      margin: 0;
    }

    /* 4. QR 코드 박스 (x:80, y:215, 240×240)
       Figma: 4px 그라데이션 보더 (#1EA3AE → #2F87EA)
       border-image는 border-radius와 호환 X → 외곽 그라데이션 박스 + 내부 흰색 박스 구조 */
    .qr-box {
      position: absolute;
      left: 80px;
      top: 215px;
      width: 240px;
      height: 240px;
      background: linear-gradient(151.4deg, #1EA3AE 40.865%, #2F87EA 59.621%);
      border-radius: 20px;
      padding: 4px;
      box-sizing: border-box;
    }

    .qr-box-inner {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    .qr-code-image {
      width: 160px;
      height: 160px;
      display: block;
      pointer-events: none;
    }

    /* 5. 카운트다운 "60" (절대 y:463, center, 32px SemiBold #6E7683) */
    .qr-countdown {
      position: absolute;
      left: 50%;
      top: 463px;
      transform: translateX(-50%);
      font-size: 32px;
      font-weight: 600;
      color: #6E7683;
      line-height: 1.3;
      text-align: center;
      white-space: nowrap;
    }

    /* 6. 하단 toss 로고 (y:589, 80×24, center) */
    .qr-logo {
      position: absolute;
      top: 589px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 24px;
      object-fit: contain;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="device-stage">
    <div class="device-mockup">
      <div class="device-frame">
        <div class="device-screen">
          <div class="qr-screen">

            <!-- 1. 뒤로가기 -->
            <button class="qr-back" type="button" onclick="history.length > 1 ? history.back() : go('arrival.html')" aria-label="뒤로가기">
              <svg width="18" height="16" viewBox="0 0 18 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M17 8H1M1 8L8 15M1 8L8 1" stroke="#363D4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>

            <!-- 1-2. 홈 버튼 (우상단) - 사용자 제공 home.png (패딩 포함, 40×40) -->
            <button class="qr-home" type="button" onclick="go('index.html')" aria-label="홈">
              <img src="assets/home.png" alt="홈" width="40" height="40" />
            </button>

            <!-- 2. 서브 라벨 (그라데이션) -->
            <div class="qr-subtitle">QR 인증</div>

            <!-- 3. 메인 타이틀 (2줄) -->
            <div class="qr-title">
              <p>스윙와일 앱으로</p>
              <p>하단 QR코드를 스캔하세요</p>
            </div>

            <!-- 4. QR 코드 박스 (그라데이션 보더) -->
            <div class="qr-box">
              <div class="qr-box-inner">
                <img class="qr-code-image" src="assets/qr-code.png" alt="QR Code" />
              </div>
            </div>

            <!-- 5. 카운트다운 (60초 → 0초까지) -->
            <div class="qr-countdown" id="qr-countdown">60</div>

            <!-- 6. toss 로고 -->
            <img class="qr-logo" src="assets/toss-logo.png" alt="toss" />

          </div>
        </div>
      </div>
      <div class="device-stand"></div>
      <div class="device-base"></div>
    </div>
  </div>

  <script src="scripts/common.js"></script>
  <script>
    // ── 카운트다운 60 → 0 (프로토타입: 0에서 정지만, 실제 운영 시 메인페이지 이동) ──
    (function () {
      const el = document.getElementById('qr-countdown');
      if (!el) return;
      let n = 60;
      const tick = () => {
        n -= 1;
        el.textContent = String(n);
        if (n <= 0) {
          clearInterval(timer);
        }
      };
      const timer = setInterval(tick, 1000);
    })();
  </script>
</body>
</html>
