<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=400, initial-scale=1.0" />
  <title>엘커넥트 · 타석배정 최종완료 페이지 (LCN-PCH-010)</title>
  <link rel="stylesheet" href="styles/common.css" />
  <style>
    /* ───────────────────────────────────────────
       타석배정 최종완료 페이지 (LCN-PCH-010) — Figma 310:687 확정
       Canvas 400×640
       - 결제 성공 후 카드를 빼면 자동 진입
       - 시작/종료 시간 + 배정된 타석 리스트 + 10초 카운트다운 + 확인 버튼
       ─────────────────────────────────────────── */
    .final-screen {
      position: absolute;
      inset: 0;
      background: #ffffff;
      font-family: "Pretendard", -apple-system, sans-serif;
      overflow: hidden;
    }

    /* 1. 헤더 (y:56, padding 24, gap 4, center) */
    .final-subtitle {
      position: absolute;
      left: 24px;
      top: 80px;
      width: 352px;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.37;
      text-align: center;
      background: linear-gradient(151.4deg, #1EA3AE 40.865%, #2F87EA 59.621%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }
    .final-title {
      position: absolute;
      left: 24px;
      top: 107px;
      width: 352px;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.37;
      color: #363D4A;
      text-align: center;
    }

    /* 2. 시간 정보 행 (x:28, y:169, w:340, h:81, gap:12) */
    .final-info {
      position: absolute;
      left: 28px;
      top: 169px;
      width: 340px;
      height: 81px;
      display: flex;
      gap: 12px;
    }
    .final-info-box {
      flex: 1;
      min-width: 0;
      background: #F3F5F8;
      border-radius: 24px;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      box-sizing: border-box;
    }
    .final-info-label {
      font-size: 15px;
      font-weight: 500;
      color: #6B7684;
      line-height: 1.4;
    }
    .final-info-value {
      font-size: 20px;
      font-weight: 600;
      color: #363D4A;
      line-height: 1.3;
    }

    /* 3. 타석 리스트 (x:28, y:266, w:340, h:224, bg #F3F5F8, radius 16, padding 24 32)
       overflow-y: auto — 항목이 영역 초과 시 세로 스크롤 가능
       스크롤바는 common.css 의 .device-screen 글로벌 룰로 자동 숨김 */
    .final-seat-list {
      position: absolute;
      left: 28px;
      top: 266px;
      width: 340px;
      height: 224px;
      background: #F3F5F8;
      border-radius: 16px;
      padding: 24px 32px;
      overflow-y: auto;
      overscroll-behavior: contain;
      box-sizing: border-box;
    }
    .final-seat-rows {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .final-seat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 19px;
      line-height: 1.2;
    }
    .final-seat-row .floor {
      flex: 1;
      color: #333D4B;
      font-weight: 400;
    }
    .final-seat-row .num {
      flex: 1;
      color: #2B77E4;
      font-weight: 600;
      text-align: right;
    }

    /* 4. 하단 (bottom 0, w:400, h:142, padding pb:20 px:24, gap:24, items-center justify-end) */
    .final-bottom {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      width: 400px;
      height: 142px;
      padding: 0 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      gap: 24px;
      box-sizing: border-box;
    }
    .final-close-hint {
      font-size: 15px;
      font-weight: 500;
      color: #6B7684;
      line-height: 1.4;
      text-align: center;
      white-space: nowrap;
    }
    .final-confirm-btn {
      width: 360px;
      height: 56px;
      background: #3182F6;
      color: #ffffff;
      border: none;
      border-radius: 16px;
      font-family: inherit;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="device-stage">
    <div class="device-mockup">
      <div class="device-frame">
        <div class="device-screen">
          <div class="final-screen">

            <!-- 1. 헤더 -->
            <div class="final-subtitle">환영합니다!</div>
            <div class="final-title">5분 뒤 시간이 활성화돼요</div>

            <!-- 2. 시작/종료 시간 -->
            <div class="final-info">
              <div class="final-info-box">
                <div class="final-info-label">시작 시간</div>
                <div class="final-info-value">17:12</div>
              </div>
              <div class="final-info-box">
                <div class="final-info-label">종료 시간</div>
                <div class="final-info-value">19:12</div>
              </div>
            </div>

            <!-- 3. 타석 리스트 -->
            <div class="final-seat-list">
              <div class="final-seat-rows">
                <div class="final-seat-row"><span class="floor">2F</span><span class="num">8번</span></div>
                <div class="final-seat-row"><span class="floor">2F</span><span class="num">14번</span></div>
                <div class="final-seat-row"><span class="floor">2F</span><span class="num">20번</span></div>
                <div class="final-seat-row"><span class="floor">2F</span><span class="num">26번</span></div>
                <div class="final-seat-row"><span class="floor">2F</span><span class="num">32번</span></div>
                <div class="final-seat-row"><span class="floor">2F</span><span class="num">38번</span></div>
                <div class="final-seat-row"><span class="floor">2F</span><span class="num">44번</span></div>
                <div class="final-seat-row"><span class="floor">2F</span><span class="num">50번</span></div>
                <div class="final-seat-row"><span class="floor">2F</span><span class="num">56번</span></div>
                <div class="final-seat-row"><span class="floor">2F</span><span class="num">62번</span></div>
              </div>
            </div>

            <!-- 4. 하단 -->
            <div class="final-bottom">
              <div class="final-close-hint">
                <span id="final-countdown">10</span>초뒤에 닫혀요
              </div>
              <button class="final-confirm-btn" type="button" onclick="go('index.html')">확인</button>
            </div>

          </div>
        </div>
      </div>
      <div class="device-stand"></div>
      <div class="device-base"></div>
    </div>
  </div>

  <script src="scripts/common.js"></script>
  <script>
    // ── 카운트다운 10 → 0 (프로토타입: 0에서 정지, 실제 운영 시 메인페이지 이동) ──
    (function () {
      const el = document.getElementById('final-countdown');
      if (!el) return;
      let n = 10;
      const tick = () => {
        n -= 1;
        el.textContent = String(n);
        if (n <= 0) {
          clearInterval(timer);
        }
      };
      const timer = setInterval(tick, 1000);
    })();
  </script>
</body>
</html>
